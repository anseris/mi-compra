services:
  - type: web
    name: mi-compra-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: mi-compra-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist/mi-compra/browser
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: API_HOST
        fromService:
          type: web
          name: mi-compra-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
